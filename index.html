<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box}body{margin:0;padding:0}img{max-width:100%}[hidden]{display:none!important}</style></head><body>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style id="pageStyle">
/* Layout: a transit line — each category is a station; the page is the route map for students' free time */
:root{
  --bg:#EDF1F4; --surface:#FFFFFF; --surface-2:#F6F8FA; --ink:#0E1B26; --muted:#56646F; --line:#D3DBE1;
  --accent:#0B5FC7; --accent-ink:#FFFFFF; --accent-soft:#E1ECFA;
  --c-proje:#D9480F; --c-oyun:#2B8A3E; --c-klavye:#7048E8; --c-kesif:#0B7285; --c-video:#C92A2A; --c-diger:#5C6B77;
  --ok:#2B8A3E; --warn:#B35C00; --bad:#C92A2A;
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body:"Figtree", "Segoe UI", system-ui, sans-serif;
  --mono:"JetBrains Mono", ui-monospace, "Cascadia Mono", monospace;
  --radius:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B131A; --surface:#121D26; --surface-2:#172430; --ink:#E4ECF2; --muted:#93A3B0; --line:#243441;
  --accent:#5EA3FF; --accent-ink:#06121E; --accent-soft:#16304D;
  --c-proje:#FF8A4C; --c-oyun:#5CC46E; --c-klavye:#A58BFF; --c-kesif:#3BC0D6; --c-video:#FF6B6B; --c-diger:#9AA9B5;
  --ok:#5CC46E; --warn:#F2A541; --bad:#FF6B6B; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0B131A; --surface:#121D26; --surface-2:#172430; --ink:#E4ECF2; --muted:#93A3B0; --line:#243441;
  --accent:#5EA3FF; --accent-ink:#06121E; --accent-soft:#16304D;
  --c-proje:#FF8A4C; --c-oyun:#5CC46E; --c-klavye:#A58BFF; --c-kesif:#3BC0D6; --c-video:#FF6B6B; --c-diger:#9AA9B5;
  --ok:#5CC46E; --warn:#F2A541; --bad:#FF6B6B; color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55}
.wrap{max-width:1120px;margin:0 auto;padding-inline:20px;padding-block:20px 64px;display:flex;flex-direction:column;gap:40px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;letter-spacing:-.01em}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

/* Header */
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.teacher{display:flex;align-items:center;gap:14px;min-width:0}
.avatar{width:64px;height:64px;border-radius:50%;flex:none;object-fit:cover;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:22px;box-shadow:0 0 0 3px var(--surface),0 0 0 5px var(--accent)}
.teacher .name{font-family:var(--display);font-weight:700;font-size:20px;line-height:1.2}
.teacher .role{color:var(--muted);font-size:14px}
.school{display:flex;align-items:center;gap:10px;padding:8px 14px;background:var(--surface);border:1px solid var(--line);border-radius:999px;min-width:0}
.school img{height:52px;width:auto;max-width:160px;object-fit:contain}
.school span{font-weight:600;font-size:14px;line-height:1.25}

/* Hero */
.hero{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:32px;align-items:end}
.hero h1{font-size:clamp(40px,7vw,76px);font-weight:800;line-height:.98}
.hero h1 em{font-style:normal;color:var(--accent)}
.hero p{margin:14px 0 0;color:var(--muted);font-size:18px;max-width:52ch}
.ticket{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;display:flex;flex-direction:column;gap:10px;position:relative}
.ticket::before,.ticket::after{content:"";position:absolute;width:18px;height:18px;border-radius:50%;background:var(--bg);border:1px solid var(--line);top:50%;transform:translateY(-50%)}
.ticket::before{left:-10px;clip-path:inset(0 0 0 50%)} .ticket::after{right:-10px;clip-path:inset(0 50% 0 0)}
.ticket .row{display:flex;justify-content:space-between;gap:12px;font-family:var(--mono);font-size:13px;color:var(--muted)}
.ticket .row b{color:var(--ink);font-weight:500}
.ticket .rule{border-top:1px dashed var(--line)}
@media (max-width:760px){.hero{grid-template-columns:1fr}}

/* Line / stations */
.line-wrap{overflow-x:auto;padding-bottom:4px}
.line{display:flex;gap:0;min-width:max-content;position:relative;padding-top:6px}
.station{appearance:none;background:none;border:0;cursor:pointer;display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding:0;min-width:150px;text-align:left;position:relative}
.station .track{display:flex;align-items:center;width:100%}
.station .dot{width:22px;height:22px;border-radius:50%;background:var(--surface);border:5px solid var(--c);flex:none;transition:transform .15s}
.station .bar{height:6px;flex:1;background:var(--c);opacity:.35;margin-left:-2px}
.station:last-child .bar{visibility:hidden}
.station .lbl,.station .cnt{padding-right:22px}
.station .lbl{font-weight:700;font-size:15px;line-height:1.2}
.station .cnt{font-family:var(--mono);font-size:12px;color:var(--muted)}
.station[aria-pressed="true"] .dot{background:var(--c);transform:scale(1.18)}
.station[aria-pressed="true"] .lbl{color:var(--c)}
.station:hover .dot{transform:scale(1.12)}

.tools{display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.search{flex:1 1 260px;max-width:380px;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:8px 16px}
.search input{border:0;background:none;outline:none;width:100%;min-width:0}
.search svg{flex:none;color:var(--muted)}

/* Cards */
.group{display:flex;flex-direction:column;gap:14px}
.group-head{display:flex;align-items:baseline;gap:12px}
.group-head h2{font-size:24px}
.group-head .pill{width:14px;height:14px;border-radius:50%;background:var(--c);flex:none;align-self:center}
.group-head .cnt{font-family:var(--mono);font-size:12px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.card{position:relative;display:flex;gap:14px;align-items:flex-start;padding:16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);text-decoration:none;transition:border-color .15s, transform .15s;min-width:0}
.card:hover{border-color:var(--c);transform:translateY(-2px)}
.mono{width:44px;height:44px;border-radius:12px;flex:none;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:19px;color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent)}
.card .txt{min-width:0;flex:1;display:flex;flex-direction:column;gap:3px}
.card .t{font-weight:700;line-height:1.25}
.card .d{font-size:14px;color:var(--muted);line-height:1.4}
.card .u{font-family:var(--mono);font-size:12px;color:var(--c);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:4px}
.card .new{font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);margin-left:6px}
.del{position:absolute;top:8px;right:8px;border:1px solid var(--line);background:var(--surface-2);border-radius:999px;font-size:12px;padding:2px 10px;cursor:pointer;color:var(--muted)}
.del.arm{background:var(--bad);border-color:var(--bad);color:#fff}
.empty{padding:28px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:var(--radius)}

/* Panels */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:24px;display:flex;flex-direction:column;gap:16px}
.panel h2{font-size:26px}
.panel .lead{color:var(--muted);margin:0;max-width:62ch}
.two{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:28px}
@media (max-width:820px){.two{grid-template-columns:1fr}}
form{display:grid;gap:12px}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-weight:600;font-size:14px}
.field input,.field select,.field textarea{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;min-width:0}
.field textarea{min-height:76px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:520px){.row2{grid-template-columns:1fr}}
.btn{appearance:none;border:0;border-radius:999px;padding:10px 20px;font-weight:700;cursor:pointer;background:var(--accent);color:var(--accent-ink);justify-self:start}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.ghost{background:var(--surface-2);color:var(--ink);border:1px solid var(--line)}
.btn.ok{background:var(--ok);color:#fff} .btn.no{background:transparent;color:var(--bad);border:1px solid var(--bad)}
.btn.sm{padding:6px 14px;font-size:14px}
.msg{font-size:14px;padding:10px 14px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line)}
.msg.good{border-color:var(--ok);color:var(--ok)} .msg.err{border-color:var(--bad);color:var(--bad)}

.list{display:flex;flex-direction:column;gap:10px;margin:0;padding:0;list-style:none}
.item{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;padding:12px 14px;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;flex-wrap:wrap}
.item .txt{min-width:0;flex:1 1 220px}
.item .t{font-weight:700}
.item .u{font-family:var(--mono);font-size:12px;color:var(--accent);word-break:break-all}
.item .n{font-size:14px;color:var(--muted);margin-top:2px}
.item .acts{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.status{font-family:var(--mono);font-size:12px;padding:3px 10px;border-radius:999px;border:1px solid currentColor;white-space:nowrap}
.status.pending{color:var(--warn)} .status.approved{color:var(--ok)} .status.rejected{color:var(--bad)}

.admin{border:2px solid var(--accent)}
.admin-badge{font-family:var(--mono);font-size:12px;background:var(--accent);color:var(--accent-ink);padding:3px 10px;border-radius:999px;align-self:flex-start}
.uploads{display:flex;gap:14px;flex-wrap:wrap}
.upl{display:flex;align-items:center;gap:10px;padding:10px 14px;border:1px dashed var(--line);border-radius:12px;cursor:pointer;font-weight:600;font-size:14px}
.upl input{position:absolute;width:1px;height:1px;opacity:0}
.sub{font-family:var(--display);font-size:18px;font-weight:700}
.top-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.login-form{max-width:420px}
.btn.danger{background:var(--bad);color:#fff}
.modal{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:16px;background:color-mix(in srgb,#000 45%,transparent)}
.modal[hidden]{display:none}
.modal-card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:24px;width:100%;max-width:400px;display:flex;flex-direction:column;gap:12px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.modal-card h3{font-size:22px}
.modal-card p{margin:0;color:var(--muted)}
.modal-acts{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
footer{color:var(--muted);font-size:13px;text-align:center}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<template id="shell"><div class="wrap">
  <header class="top">
    <div class="teacher">
      <div id="avatarBox"><div class="avatar" aria-hidden="true">SB</div></div>
      <div>
        <div class="name">Sümeyra Bildi</div>
        <div class="role">Bilgisayar Öğretmeni</div>
      </div>
    </div>
    <div class="top-right"><div class="school" id="schoolBox"><span>ODTÜ Geliştirme Vakfı Okulları</span></div><button class="btn ghost sm" id="loginBtn" type="button">Öğretmen girişi</button></div>
  </header>

  <section class="hero">

  <section class="group" aria-label="Duraklar">

      <div style="display:flex;flex-direction:column;gap:12px">
        <div class="sub">Önerilerin</div>
        <ul class="list" id="myList"></ul>
      </div>
    </div>
  </section>

  <footer>Eğlen-Öğren · Sümeyra Bildi · Bilgisayar dersi öğrencileri için</footer>

  <div class="modal" id="confirmBox" hidden role="dialog" aria-modal="true" aria-labelledby="confirmTitle">

    </div>
  </div>
</div>

const SKEL='<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>';
const HEAD='<title>Eğlen-Öğren</title>\n<link rel="preconnect" href="https://fonts.googleapis.com">\n<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>\n<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">';
const CATS=[
  {id:'proje',name:'Proje Atölyesi',v:'--c-proje'},
  {id:'oyun',name:'Zekâ Oyunları',v:'--c-oyun'},
  {id:'klavye',name:'Klavye Ustalığı',v:'--c-klavye'},
  {id:'kesif',name:'Keşfet & Yapay Zekâ',v:'--c-kesif'},
  {id:'video',name:'Video Kanalları',v:'--c-video'}
];
const DATA=JSON.parse(document.getElementById('data').textContent);
document.getElementById('app').replaceChildren(document.getElementById('shell').content.cloneNode(true));

const catOf=id=>CATS.find(c=>c.id===id)||{id:'diger',name:'Diğer',v:'--c-diger'};
const $=s=>document.querySelector(s);
const el=(tag,cls,text)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e};
const safeUrl=u=>/^https?:\/\/[^\s]+\.[^\s]+/i.test(u||'')?u:null;
const host=u=>{try{return new URL(u).hostname.replace(/^www\./,'')}catch(e){return u}};
const normUrl=u=>{try{const x=new URL(u);return (x.hostname.replace(/^www\./,'')+x.pathname).replace(/\/+$/,'').toLowerCase()}catch(e){return (u||'').toLowerCase()}};
const links=DATA.links||[];

let db=null,user=null,art=null,myId=null,isOwner=false;
const AUTH='ab1412d67f5954216d801b1c803ef125a2e290d5f759903f6ecfd65a8efd5abd';
let teacher=false;try{teacher=sessionStorage.getItem('kh-teacher')==='1'}catch(e){}
async function sha(s){const h=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return [...new Uint8Array(h)].map(x=>x.toString(16).padStart(2,'0')).join('')}
function applyTeacher(){$('#adminPanel').hidden=!teacher;$('#loginBtn').textContent=teacher?'Çıkış yap':'Öğretmen girişi';renderLinks();renderPending()}
let sugs=[],active='all',query='';

for(const s of ['#sCat','#aCat']){const sel=$(s);CATS.forEach(c=>{const o=el('option',null,c.name);o.value=c.id;sel.append(o)})}

// Rebuild the complete page from its canonical parts plus new data, then publish it
function buildPage(data){
  const css=document.getElementById('pageStyle').textContent;
  const shell=document.getElementById('shell').innerHTML;
  const js=document.getElementById('appjs').textContent;
  const json=JSON.stringify(data).replace(/</g,'\\u003c');
  return SKEL+HEAD+'\n<style id="pageStyle">'+css+'</style>\n<template id="shell">'+shell+'</template>\n<div id="app"></div>\n<script type="application/json" id="data">'+json+'<\/script>\n<script id="appjs">'+js+'<\/script>\n</body></html>';
}
async function save(mutate,msgSel){
  if(!art){showMsg(msgSel,!(window.claude&&window.claude.use)?'Bu kopya claude.ai dışında açıldığı için değişiklik kaydedemez. Siteyi claude.ai bağlantısından açıp tekrar dene.':'Değişikliği kaydetmek için bu tarayıcıda claude.ai hesabınla oturum açmalısın.','err');return false}
  const next=JSON.parse(JSON.stringify(DATA));mutate(next);
  showMsg(msgSel,'Kaydediliyor… Sayfa birazdan yenilenecek.','');
  try{await art.publish(buildPage(next));return true}
  catch(e){if(e&&['not_writer','not_granted','capability_disabled','consent_required'].includes(e.code)){showMsg(msgSel,'Değişikliği kaydetmek için bu tarayıcıda sayfanın sahibi olan claude.ai hesabınla oturum açmalısın.','err');return false}
    showMsg(msgSel,e&&e.code==='conflict'?'Sayfa başka bir yerde güncellendi; en son hali yükleniyor. Sonra tekrar dene.':'Kaydedilemedi. Birkaç saniye sonra tekrar dene.','err');return false}
}

function renderLine(){
  const line=$('#line');line.replaceChildren();
  [{id:'all',name:'Tüm hat',v:'--accent'},...CATS].forEach(c=>{
    const n=c.id==='all'?links.length:links.filter(l=>l.category===c.id).length;
    const b=el('button','station');b.type='button';b.style.setProperty('--c',`var(${c.v})`);
    b.setAttribute('aria-pressed',String(active===c.id));
    const tr=el('span','track');tr.append(el('span','dot'),el('span','bar'));
    b.append(tr,el('span','lbl',c.name),el('span','cnt',`${n} bağlantı`));
    b.onclick=()=>{active=c.id;renderLine();renderLinks()};
    line.append(b);
  });
}

function renderLinks(){
  const box=$('#groups');box.replaceChildren();
  $('#tLinks').textContent=links.length;
  $('#tStudent').textContent=links.filter(l=>l.fromStudent).length;
  const q=query.trim().toLocaleLowerCase('tr');
  const shown=links.filter(l=>(active==='all'||l.category===active)&&(!q||[l.title,l.desc,l.url,catOf(l.category).name].join(' ').toLocaleLowerCase('tr').includes(q)));
  $('#resultInfo').textContent=`${shown.length} sonuç`;
  if(!links.length){box.append(el('div','empty','Hatta henüz durak yok. Öğretmen panelinden ilk bağlantıyı ekleyebilirsin.'));return}
  if(!shown.length){box.append(el('div','empty','Bu aramayla eşleşen site yok. Başka bir kelime dene ya da aşağıdan yeni bir site öner.'));return}
  const cats=[...CATS];if(shown.some(l=>!CATS.find(c=>c.id===l.category)))cats.push(catOf('x'));
  cats.forEach(c=>{
    const items=shown.filter(l=>catOf(l.category).id===c.id);
    if(!items.length)return;
    const g=el('section','group');g.style.setProperty('--c',`var(${c.v})`);
    const h=el('div','group-head');h.append(el('span','pill'),el('h2',null,c.name),el('span','cnt',`${items.length} bağlantı`));
    const grid=el('div','grid');
    items.forEach(l=>{
      const url=safeUrl(l.url);
      const a=el(url?'a':'div','card');if(url){a.href=url;a.target='_blank';a.rel='noopener noreferrer'}
      const m=el('div','mono',(l.title||'?').trim().charAt(0).toLocaleUpperCase('tr'));
      const t=el('div','txt');const tt=el('div','t',l.title||'Adsız');
      if(l.fromStudent)tt.append(el('span','new','öğrenci önerisi'));
      t.append(tt);if(l.desc)t.append(el('div','d',l.desc));t.append(el('div','u',host(l.url)+' ↗'));
      a.append(m,t);
      if(teacher){
        const d=el('button','del','Sil');d.type='button';
        d.onclick=async ev=>{ev.preventDefault();ev.stopPropagation();
          if(!await askConfirm(`“${l.title}” listeden kaldırılacak. Bu işlem geri alınamaz.`))return;
          d.disabled=true;d.textContent='Siliniyor…';
          await save(n=>{n.links=n.links.filter(x=>x.id!==l.id)},'#addMsg');};
        a.append(d);
      }
      grid.append(a);
    });
    g.append(h,grid);box.append(g);
  });
}

function askConfirm(text){return new Promise(res=>{
  const box=$('#confirmBox');$('#confirmText').textContent=text;box.hidden=false;$('#cNo').focus();
  const done=v=>{box.hidden=true;$('#cYes').onclick=$('#cNo').onclick=box.onclick=null;document.removeEventListener('keydown',key);res(v)};
  const key=e=>{if(e.key==='Escape')done(false)};document.addEventListener('keydown',key);
  $('#cYes').onclick=()=>done(true);$('#cNo').onclick=()=>done(false);box.onclick=e=>{if(e.target===box)done(false)}})}
function showMsg(sel,text,kind){const m=$(sel);m.hidden=false;m.className='msg '+(kind||'');m.textContent=text}

function renderMine(){
  const ul=$('#myList');ul.replaceChildren();
  if(!db||!myId){ul.append(el('li','empty','Önerilerinin durumunu görmek için claude.ai hesabınla oturum aç.'));return}
  const mine=sugs.filter(s=>s.by===myId).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
  if(!mine.length){ul.append(el('li','empty','Henüz öneri göndermedin. İlk öneriyi sen yap!'));return}
  const lab={pending:'Onay bekliyor',approved:'Hatta eklendi',rejected:'Kabul edilmedi'};
  mine.forEach(s=>{
    const li=el('li','item');const t=el('div','txt');
    t.append(el('div','t',s.title),el('div','u',host(s.url)));
    const st=s.status||'pending';li.append(t,el('span','status '+st,lab[st]||st));ul.append(li);
  });
}

function slug(t){const b=(t||'site').toLocaleLowerCase('tr').replace(/ç/g,'c').replace(/ğ/g,'g').replace(/ı/g,'i').replace(/ö/g,'o').replace(/ş/g,'s').replace(/ü/g,'u').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,40)||'site';return b+'-'+Date.now().toString(36)}

function renderPending(){
  if(!teacher)return;
  const ul=$('#pendingList');ul.replaceChildren();
  if(!db){ul.append(el('li','empty',!(window.claude&&window.claude.use)?'Bu kopya claude.ai dışında açıldığı için öneriler burada görünmez. Siteyi claude.ai bağlantısından aç.':'Önerileri görmek için bu tarayıcıda claude.ai hesabınla oturum açmalısın.'));return}
  const pend=sugs.filter(s=>(s.status||'pending')==='pending').sort((a,b)=>(a.createdAt||0)-(b.createdAt||0));
  if(!pend.length){ul.append(el('li','empty','Bekleyen öneri yok. Öğrenciler öneri gönderdiğinde burada görünecek.'));return}
  pend.forEach(s=>{
    const li=el('li','item');const t=el('div','txt');
    const url=safeUrl(s.url);const u=el(url?'a':'div','u',s.url);if(url){u.href=url;u.target='_blank';u.rel='noopener noreferrer'}
    t.append(el('div','t',s.title),u);if(s.note)t.append(el('div','n','“'+s.note+'”'));
    const dup=links.some(l=>normUrl(l.url)===normUrl(s.url));
    if(dup)t.append(el('div','n','Bu adres zaten listede.'));
    const acts=el('div','acts');
    const sel=el('select');sel.setAttribute('aria-label','Durak');sel.style.cssText='background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 8px';
    CATS.forEach(c=>{const o=el('option',null,c.name);o.value=c.id;if(c.id===s.category)o.selected=true;sel.append(o)});
    const ok=el('button','btn ok sm','Kabul et');ok.type='button';
    const no=el('button','btn no sm','Reddet');no.type='button';
    ok.disabled=!url;
    ok.onclick=async()=>{ok.disabled=no.disabled=true;
      try{await db.collection('suggestions').doc(s.id).update({status:'approved',category:sel.value,decidedAt:Date.now()})}
      catch(e){ok.disabled=no.disabled=false;ok.textContent='Tekrar dene';return}
      if(dup)return;
      await save(n=>{n.links.push({id:slug(s.title),title:s.title,url:s.url,desc:(s.note||'').slice(0,120),category:sel.value,fromStudent:true})},'#pendMsg');};
    no.onclick=async()=>{ok.disabled=no.disabled=true;
      try{await db.collection('suggestions').doc(s.id).update({status:'rejected',decidedAt:Date.now()})}catch(e){ok.disabled=no.disabled=false}};
    acts.append(sel,ok,no);li.append(t,acts);ul.append(li);
  });
}

function renderSite(){
  if(DATA.photo&&/^data:image\//.test(DATA.photo)){const i=el('img','avatar');i.src=DATA.photo;i.alt='Sümeyra Bildi';$('#avatarBox').replaceChildren(i)}
  if(DATA.logo&&/^data:image\//.test(DATA.logo)){const i=el('img');i.src=DATA.logo;i.alt='ODTÜ Geliştirme Vakfı Okulları logosu';$('#schoolBox').replaceChildren(i,el('span',null,'ODTÜ Geliştirme Vakfı Okulları'))}
}

function shrink(file,max,type){return new Promise((res,rej)=>{
  const r=new FileReader();r.onerror=rej;r.onload=()=>{const img=new Image();img.onerror=rej;img.onload=()=>{
    const k=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement('canvas');
    c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    let out=c.toDataURL(type,.85);if(out.length>150000)out=c.toDataURL('image/jpeg',.7);res(out)};img.src=r.result};r.readAsDataURL(file)})}

async function upload(field,input,max,type){
  const f=input.files&&input.files[0];if(!f)return;
  let data;try{data=await shrink(f,max,type)}catch(e){showMsg('#upMsg','Bu dosya okunamadı. PNG ya da JPG bir görsel seç.','err');return}
  input.value='';
  await save(n=>{n[field]=data},'#upMsg');
}

function sugText(){return `Eğlen-Öğren site önerisi\nSite: ${$('#sTitle').value.trim()}\nAdres: ${$('#sUrl').value.trim()}\nDurak: ${catOf($('#sCat').value).name}\nNeden: ${$('#sNote').value.trim()}`}
function offerCopy(reason){
  showMsg('#sugMsg',reason+' Öneriyi kopyalayıp öğretmenine iletebilirsin.','err');
  $('#copyBtn').hidden=false;
}
$('#copyBtn').addEventListener('click',async()=>{
  const txt=sugText();
  try{await navigator.clipboard.writeText(txt);showMsg('#sugMsg','Öneri kopyalandı. Öğretmenine mesaj olarak gönderebilirsin.','good')}
  catch(e){showMsg('#sugMsg',txt,'')}
});

$('#q').addEventListener('input',e=>{query=e.target.value;renderLinks()});

$('#sugForm').addEventListener('submit',async e=>{
  e.preventDefault();
  const title=$('#sTitle').value.trim(),url=$('#sUrl').value.trim(),note=$('#sNote').value.trim(),category=$('#sCat').value;
  if(!safeUrl(url)){showMsg('#sugMsg','Adres https:// ile başlamalı. Örnek: https://scratch.mit.edu','err');return}
  if(links.some(l=>normUrl(l.url)===normUrl(url))){showMsg('#sugMsg','Bu site zaten hatta var. Başka bir site önermeyi dene.','err');return}
  if(!db){offerCopy('Öneri göndermek için claude.ai hesabınla oturum açman gerekiyor.');return}
  $('#sBtn').disabled=true;
  try{await db.collection('suggestions').add({title,url,note,category,status:'pending',by:myId||null,createdAt:Date.now()});
    e.target.reset();$('#copyBtn').hidden=true;showMsg('#sugMsg','Önerin öğretmenine iletildi. Onaylanınca hatta otomatik eklenecek.','good');
  }catch(err){offerCopy('Önerin buradan gönderilemedi; bunun için öğretmeninin seni sayfaya davet etmesi gerekiyor.')}
  $('#sBtn').disabled=false;
});

$('#addForm').addEventListener('submit',async e=>{
  e.preventDefault();
  const title=$('#aTitle').value.trim(),url=$('#aUrl').value.trim(),desc=$('#aDesc').value.trim(),category=$('#aCat').value;
  if(!safeUrl(url)){showMsg('#addMsg','Adres https:// ile başlamalı.','err');return}
  if(links.some(l=>normUrl(l.url)===normUrl(url))){showMsg('#addMsg','Bu adres zaten listede.','err');return}
  await save(n=>{n.links.push({id:slug(title),title,url,desc,category})},'#addMsg');
});
$('#upPhoto').addEventListener('change',e=>upload('photo',e.target,320,'image/jpeg'));
$('#upLogo').addEventListener('change',e=>upload('logo',e.target,400,'image/png'));

$('#loginBtn').addEventListener('click',()=>{
  if(teacher){teacher=false;try{sessionStorage.removeItem('kh-teacher')}catch(e){}applyTeacher();return}
  $('#loginPanel').hidden=false;$('#lUser').focus();$('#loginPanel').scrollIntoView({behavior:'smooth',block:'center'})});
$('#loginCancel').addEventListener('click',()=>{$('#loginPanel').hidden=true;$('#loginForm').reset();$('#loginMsg').hidden=true});
$('#loginForm').addEventListener('submit',async e=>{
  e.preventDefault();
  let h='';try{h=await sha($('#lUser').value.trim()+':'+$('#lPass').value)}catch(err){showMsg('#loginMsg','Bu tarayıcı girişi doğrulayamadı.','err');return}
  if(h!==AUTH){showMsg('#loginMsg','Kullanıcı adı veya şifre hatalı.','err');$('#lPass').value='';return}
  teacher=true;try{sessionStorage.setItem('kh-teacher','1')}catch(err){}
  $('#loginForm').reset();$('#loginMsg').hidden=true;$('#loginPanel').hidden=true;applyTeacher();
  $('#adminPanel').scrollIntoView({behavior:'smooth',block:'start'})});

renderSite();renderLine();renderLinks();renderMine();applyTeacher();

(async()=>{
  if(!(window.claude&&window.claude.use))return;
  [db,user,art]=await Promise.all(['db','user','artifact'].map(n=>window.claude.use(n).catch(()=>null)));
  if(user){isOwner=await user.isOwner();myId=await user.id()}
  renderMine();renderPending();
  if(db)db.collection('suggestions').onSnapshot(s=>{sugs=s.docs.map(d=>({id:d.id,...d.data()}));renderMine();renderPending()},()=>{});
})();
</script>

</body></html>
